name: Refresh secure Node Zero dependencies
on:
  push:
    branches: [feat/real-synthsara-preview-2026-11-06]
    paths: [.github/workflows/refresh-node-zero-dependencies.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Upgrade vulnerable auth and refresh other patches
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact 'better-auth@1.7.18'
          npm audit fix --package-lock-only --ignore-scripts || npm audit --omit=dev --audit-level=high
      - name: Commit dependency security upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): remediate production dependency advisories'
            git push origin HEAD:feat/real-synthsara-preview-2026-11-06
          fi
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Production security audit
        run: npm audit --omit=dev --audit-level=high
